# =============================================================================
# Konthora CI — continuous integration only
# =============================================================================
# Runs on push/PR to main. Checks:
#   backend  : pip check + unit test suite (pytest)
#   frontend : eslint + tsc --noEmit + production build
#
# This workflow NEVER deploys and NEVER reads repository secrets. The real-model
# integration tests (test_integration.py / test_transcription_integration.py)
# are intentionally excluded: they download model weights and are run manually,
# as documented in backend/README.md.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pip check + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng git

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify dependency tree (pip check)
        run: python -m pip check

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest app/tests -q --timeout=120

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
