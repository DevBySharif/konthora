# =============================================================================
# Konthora — Frontend server block (konthora.dev.bd)  [OPTIONAL]
# =============================================================================
# PRIMARY ARCHITECTURE: the frontend is deployed on Vercel. Point the
# konthora.dev.bd DNS record at Vercel and DO NOT install this file on the VPS.
#
# This file is provided for one scenario only: self-hosting the Next.js app on
# the same VPS instead of Vercel (not the recommended setup). If you use it:
#   1. Run the frontend with `npm run start` bound to 127.0.0.1:3000 (systemd).
#   2. Point the konthora.dev.bd DNS record at this VPS.
#   3. Install and enable this config; obtain a Let's Encrypt certificate for
#      konthora.dev.bd.
# =============================================================================

# HTTP -> HTTPS redirect (only relevant when this VPS serves the frontend)
server {
    listen 80;
    listen [::]:80;
    server_name konthora.dev.bd www.konthora.dev.bd;
    return 301 https://konthora.dev.bd$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name konthora.dev.bd;

    ssl_certificate     /etc/letsencrypt/live/konthora.dev.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konthora.dev.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    include /etc/nginx/conf.d/security_headers.conf;

    # Next.js production server (127.0.0.1:3000)
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3000;
    }

    # Long-cache immutable static assets (hashed by Next.js)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }
}
